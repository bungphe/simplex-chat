<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản trị nhân viên AI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cửa hàng">
  <link rel="stylesheet" href="/static/admin.css">
  <script src="/i18n/catalog.js" defer></script>
  <script src="/static/i18n.js" defer></script>
  <script src="/static/admin.js" defer></script>
  <script src="/static/inventory.js" defer></script>
  <script src="/static/business.js" defer></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="login-form" class="card login-card">
      <h1>Quản trị nhân viên AI</h1>
      <label>Tên đăng nhập
        <input id="login-username" autocomplete="username" placeholder="admin" autofocus>
      </label>
      <label>Mật khẩu
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="primary">Đăng nhập</button>
      <p id="login-error" class="error" role="alert"></p>
      <div id="login-lang" class="row"></div>
    </form>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">Nhân viên AI</div>
      <nav id="nav">
        <button data-view="overview" data-admin>Tổng quan</button>
        <button data-view="inbox" data-roles="manager,agent">Hộp thư <span id="inbox-badge" class="badge" hidden></span></button>
        <button data-view="pos" data-roles="manager,agent,cashier">Bán hàng</button>
        <button data-view="customers" data-admin>Khách hàng</button>
        <button data-view="inventory" data-roles="manager,warehouse">Kho hàng</button>
        <button data-view="delivery" data-roles="manager,delivery">Giao hàng</button>
        <button data-view="marketing" data-roles="manager,marketing">Marketing</button>
        <button data-view="reports" data-roles="manager,marketing">Báo cáo</button>
        <button data-view="sla" data-admin>SLA</button>
        <button data-view="desk" data-admin>Cài đặt hộp thư</button>
        <button data-view="channels" data-admin>Kênh &amp; SimpleX</button>
        <button data-view="employees" data-admin>Nhân viên</button>
        <button data-view="approvals" data-admin>Chờ duyệt <span id="badge" class="badge" hidden></span></button>
        <button data-view="models" data-admin>Model AI</button>
        <button data-view="conversations" data-admin>Hội thoại</button>
        <button data-view="runlog" data-admin>Nhật ký</button>
        <button data-view="accounts" data-admin>Tài khoản</button>
      </nav>
      <button id="me" class="ghost" title="Tài khoản của tôi"></button>
      <button id="logout" class="ghost">Đăng xuất</button>
    </header>
    <main id="view"></main>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>
</body>
</html>
