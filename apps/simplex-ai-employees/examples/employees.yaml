# AI employees: each entry is a separate SimpleX account run by a Claude agent.
# Paths are relative to this file. Run:  python -m ai_employees run examples/employees.yaml

state_dir: ./data/state          # admin overrides, memory, notes (JSON per employee)

# Optional: pin all accounts to your own SMP servers (default: SimpleX preset servers).
# servers:
#   smp: ["smp://<fingerprint>@smp.example.com"]

plugins: [shop_skills]           # Python modules that register extra skills
plugin_paths: [./plugins]

defaults:
  model: claude-opus-5
  effort: medium                 # low | medium | high | xhigh | max | null
  history_messages: 40           # remembered turns per contact
  refusal_fallback: true         # server-side fallback model if a request is declined
  timezone: Asia/Ho_Chi_Minh
  admin_token_env: AI_ADMIN_TOKEN  # send "/admin <token>" to an employee to manage it in chat

employees:
  - id: sales
    display_name: Lan - Tư vấn bán hàng
    short_descr: Tư vấn sản phẩm, báo giá, đơn hàng
    db: ./data/sales
    welcome: Xin chào! Mình là Lan, trợ lý bán hàng. Mình có thể giúp gì cho bạn?
    system_prompt: |
      Bạn là Lan, nhân viên tư vấn bán hàng của công ty Minh An.
      Nhiệm vụ: tư vấn sản phẩm, báo giá theo bảng giá, kiểm tra đơn hàng, ghi nhận nhu cầu khách.
      Không tự đặt ra giá hoặc khuyến mãi ngoài tài liệu. Câu hỏi về hoá đơn, công nợ,
      thanh toán thì hỏi đồng nghiệp kế toán. Khách muốn gặp người thật thì chuyển tiếp.
    skills: [knowledge_search, notes, order_status, ask_colleague, handoff_to_human, current_time]
    skill_config:
      knowledge_search: {path: ./knowledge/sales}
      ask_colleague: {colleagues: [accountant]}

  - id: accountant
    display_name: Minh - Kế toán
    short_descr: Hoá đơn, thanh toán, công nợ
    db: ./data/accountant
    welcome: Chào bạn, mình là Minh bên kế toán.
    system_prompt: |
      Bạn là Minh, nhân viên kế toán của công ty Minh An.
      Trả lời về hoá đơn VAT, phương thức thanh toán, công nợ theo đúng quy định trong tài liệu.
      Không cung cấp thông tin tài chính nội bộ. Yêu cầu hoàn tiền phải chuyển cho người phụ trách.
    skills: [knowledge_search, handoff_to_human, current_time]
    skill_config:
      knowledge_search: {path: ./knowledge/accounting}
